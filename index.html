<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lux Functional Wellness</title>
<link rel="stylesheet" href="styles.css">
<style>body{background:var(--cream)}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="js/ds_bundle.js"></script>
<script type="text/babel" src="js/SiteChrome.jsx?v=5"></script>
<script type="text/babel" src="js/HomeScreen.jsx?v=5"></script>
<script type="text/babel" src="js/ApproachScreen.jsx?v=5"></script>
<script type="text/babel" src="js/ProvidersScreen.jsx?v=5"></script>
<script type="text/babel" src="js/ServicesScreen.jsx?v=5"></script>
<script type="text/babel" src="js/PartnersScreen.jsx?v=5"></script>
<script type="text/babel" src="js/ContactScreen.jsx?v=5"></script>
</head><body><div id="root"></div>
<script type="text/babel" data-presets="react">
function Site(){
  const [route,setRoute]=React.useState('home');
  const go=(r)=>{setRoute(r);window.scrollTo(0,0);};
  const Screen={home:window.HomeScreen,approach:window.ApproachScreen,providers:window.ProvidersScreen,services:window.ServicesScreen,partners:window.PartnersScreen,contact:window.ContactScreen}[route];
  return (<>
    <window.Header route={route} go={go} />
    <main><Screen go={go} /></main>
    <window.Footer go={go} />
  </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Site/>);
</script></body></html>
