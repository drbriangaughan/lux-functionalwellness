<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-page)}.ramp{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}.sw{height:64px;display:flex;align-items:flex-end;padding:6px}.n{font-family:var(--font-display);font-size:10px;font-weight:700;letter-spacing:.08em}.hex{font-family:var(--font-sans);font-size:9px;color:var(--text-subtle);margin-top:6px;letter-spacing:.04em}</style></head><body>
<div class="ramp">
<div><div class="sw" style="background:var(--navy-950)"><span class="n" style="color:rgba(255,255,255,.8)">950</span></div><div class="hex">#070F1F</div></div>
<div><div class="sw" style="background:var(--navy-900)"><span class="n" style="color:rgba(255,255,255,.8)">900</span></div><div class="hex">#0D1F3C</div></div>

<div><div class="sw" style="background:var(--navy-300)"><span class="n" style="color:rgba(13,31,60,.7)">300</span></div><div class="hex">#8492A8</div></div>
<div><div class="sw" style="background:var(--navy-100)"><span class="n" style="color:rgba(13,31,60,.7)">100</span></div><div class="hex">#DCE2EB</div></div>
