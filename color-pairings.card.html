<!-- @dsCard group="Colors" viewport="700x170" name="Approved pairings" subtitle="Gold on navy, navy on cream — never gold text on white" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-page)}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.p{padding:16px;min-height:112px;display:flex;flex-direction:column;justify-content:space-between}.h{font-family:var(--font-display);font-weight:800;font-size:18px;line-height:1.05;letter-spacing:.05em;text-transform:uppercase}.s{font-family:var(--font-sans);font-size:9px;letter-spacing:.12em;text-transform:uppercase}</style></head><body>
<div class="g">
<div class="p" style="background:var(--navy-900)"><span class="h" style="color:var(--white)">Your health has a foundation</span><span class="s" style="color:var(--gold-500)">Navy 900 + gold 500</span></div>
<div class="p" style="background:var(--cream);box-shadow:var(--shadow-1);border-top:4px solid var(--gold-500)"><span class="h" style="color:var(--navy-900)">Your health has a foundation</span><span class="s" style="color:var(--gold-700)">Cream + navy 900</span></div>
<div class="p" style="background:var(--gold-100)"><span class="h" style="color:var(--navy-900)">Your health has a foundation</span><span class="s" style="color:var(--gold-800)">Gold 100 + navy 900</span></div>
<div class="p" style="background:var(--gold-500)"><span class="h" style="color:var(--navy-900)">Your health has a foundation</span><span class="s" style="color:var(--navy-800)">Gold 500 + navy 900</span></div>
</div></body></html>
