<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{padding:20px;background:var(--surface-page)}#r{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.cell{display:flex;align-items:center;justify-content:center;padding:22px 12px;border:1px solid var(--border-hairline);border-radius:var(--radius-3);background:var(--surface-card);min-height:96px}.cell.dk{background:var(--surface-inverse);border-color:var(--border-inverse)}.cap{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-subtle);text-align:center;margin-top:6px}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script></head>
<body><div id="r"></div>
<script type="text/babel">
const { Logo } = window.LuxFunctionalWellnessDesignSystem_cefeb7;
const Cell = ({dark,children,cap}) => (<div><div className={dark?'cell dk':'cell'}>{children}</div><div className="cap">{cap}</div></div>);
function Demo(){return (<>
<Cell cap="A · Boxed"><Logo variant="boxed" size={34} /></Cell>
<Cell cap="B · Outline"><Logo variant="outline" size={30} /></Cell>
<Cell cap="C · Bracket"><Logo variant="bracket" size={32} /></Cell>
<Cell dark cap="Boxed on blue"><Logo variant="boxed" tone="onDark" size={34} /></Cell>
<Cell dark cap="Outline on blue"><Logo variant="outline" tone="onDark" size={30} /></Cell>
<Cell dark cap="Bracket, no subline"><Logo variant="bracket" tone="onDark" size={30} tagline={false} /></Cell>
</>);}
ReactDOM.createRoot(document.getElementById('r')).render(<Demo/>);
</script></body></html>
