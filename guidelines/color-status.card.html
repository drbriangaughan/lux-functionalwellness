<!-- @dsCard group="Colors" viewport="700x150" name="Status colors" subtitle="Lab results and system feedback only" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-page)}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.chip{padding:14px;border-radius:var(--radius-2);display:flex;flex-direction:column;gap:8px;min-height:78px}.t{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}.v{font-family:var(--font-mono);font-size:9px;opacity:.75}</style></head><body>
<div class="g">
<div class="chip" style="background:var(--status-success-bg)"><span class="t" style="color:var(--status-success-fg)">In range</span><span class="v" style="color:var(--status-success-fg)">--green-600 on --green-100</span></div>
<div class="chip" style="background:var(--status-warning-bg)"><span class="t" style="color:var(--status-warning-fg)">Watch</span><span class="v" style="color:var(--status-warning-fg)">--amber-600 on --amber-100</span></div>
<div class="chip" style="background:var(--status-danger-bg)"><span class="t" style="color:var(--status-danger-fg)">Out of range</span><span class="v" style="color:var(--status-danger-fg)">--red-600 on --red-100</span></div>
<div class="chip" style="background:var(--status-info-bg)"><span class="t" style="color:var(--status-info-fg)">Info</span><span class="v" style="color:var(--status-info-fg)">--blue-600 on --blue-50</span></div>
</div></body></html>
