<!-- @dsCard group="Colors" viewport="700x150" name="Gold ramp" subtitle="The brand's light — base #C9A84C from the site build" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-page)}.ramp{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}.sw{height:64px;display:flex;align-items:flex-end;padding:6px}.n{font-family:var(--font-display);font-size:10px;font-weight:700;letter-spacing:.08em}.hex{font-family:var(--font-sans);font-size:9px;color:var(--text-subtle);margin-top:6px}.tag{font-family:var(--font-sans);font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-subtle);display:block}</style></head><body>
<div class="ramp">
<div><div class="sw" style="background:var(--gold-800)"><span class="n" style="color:rgba(255,255,255,.85)">800</span></div><div class="hex">#6B551F</div></div>
<div><div class="sw" style="background:var(--gold-700)"><span class="n" style="color:rgba(255,255,255,.85)">700</span></div><div class="hex">#8B6E2F<span class="tag">gold-dim</span></div></div>
<div><div class="sw" style="background:var(--gold-600)"><span class="n" style="color:rgba(255,255,255,.85)">600</span></div><div class="hex">#A98C3C</div></div>
<div><div class="sw" style="background:var(--gold-500)"><span class="n" style="color:rgba(13,31,60,.75)">500</span></div><div class="hex">#C9A84C<span class="tag">gold — base</span></div></div>
<div><div class="sw" style="background:var(--gold-400)"><span class="n" style="color:rgba(13,31,60,.75)">400</span></div><div class="hex">#D6BA68</div></div>
<div><div class="sw" style="background:var(--gold-300)"><span class="n" style="color:rgba(13,31,60,.75)">300</span></div><div class="hex">#E2C97E<span class="tag">gold-light</span></div></div>
<div><div class="sw" style="background:var(--gold-200)"><span class="n" style="color:rgba(13,31,60,.75)">200</span></div><div class="hex">#EFDFB2</div></div>
<div><div class="sw" style="background:var(--gold-100)"><span class="n" style="color:rgba(13,31,60,.75)">100</span></div><div class="hex">#F8F0DA</div></div>
</div></body></html>
