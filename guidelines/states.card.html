<!-- @dsCard group="Motion" viewport="700x190" name="Interaction states" subtitle="Square gold CTA · hover lightens and lifts 2px" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-page)}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:start}.btn{font-family:var(--font-display);font-weight:700;font-size:14px;letter-spacing:.12em;text-transform:uppercase;padding:13px 18px;border:2px solid transparent;text-align:center}.t{font-family:var(--font-sans);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-subtle);margin-top:8px;line-height:1.6}.row2{margin-top:16px}.dk{background:var(--navy-900);padding:12px}</style></head><body>
<div class="g">
<div><div class="btn" style="background:var(--gold-500);color:var(--navy-900)">Book your review</div><div class="t">rest · gold 500</div></div>
<div><div class="btn" style="background:var(--gold-300);color:var(--navy-900);transform:translateY(-2px)">Book your review</div><div class="t">hover · gold 300, −2px y</div></div>
<div><div class="btn" style="background:var(--gold-500);color:var(--navy-900);box-shadow:var(--shadow-focus)">Book your review</div><div class="t">focus · gold ring</div></div>
<div><div class="btn" style="background:var(--gold-500);color:var(--navy-900);opacity:.42">Book your review</div><div class="t">disabled · 42%</div></div>
</div>
<div class="g row2">
<div><div class="btn" style="background:transparent;border-color:var(--navy-900);color:var(--navy-900)">Our approach</div><div class="t">secondary rest</div></div>
<div><div class="btn" style="background:var(--navy-900);border-color:var(--navy-900);color:var(--white)">Our approach</div><div class="t">secondary hover · fills</div></div>
<div class="dk"><div class="btn" style="background:transparent;border-color:rgba(255,255,255,.35);color:rgba(255,255,255,.85)">Ask a question</div><div class="t" style="color:rgba(255,255,255,.45)">onDark rest</div></div>
<div class="dk"><div class="btn" style="background:transparent;border-color:var(--gold-500);color:var(--gold-500)">Ask a question</div><div class="t" style="color:rgba(255,255,255,.45)">onDark hover</div></div>
</div></body></html>
