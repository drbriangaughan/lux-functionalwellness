<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-page)}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.cell{display:flex;align-items:center;justify-content:center;min-height:120px;background:var(--white);box-shadow:var(--shadow-1)}.cell.chosen{border-top:4px solid var(--gold-500)}.cell.dim{opacity:.42}.k{font-family:var(--font-sans);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-subtle);text-align:center;margin-top:8px;line-height:1.7}.k b{font-family:var(--font-display);color:var(--gold-700);letter-spacing:.14em}
.word{font-family:var(--font-display);font-weight:800;font-size:34px;line-height:.9;letter-spacing:.12em;text-transform:uppercase;display:block}.sub{font-family:var(--font-eyebrow);font-weight:600;font-size:10px;letter-spacing:.25em;text-transform:uppercase}
.a{display:inline-flex;flex-direction:column;gap:7px;align-items:flex-start}.a .box{background:var(--navy-900);padding:11px 14px}
.b{display:inline-flex;flex-direction:column;align-items:center;border:2px solid var(--gold-500);padding:10px 20px;gap:6px}
.c{display:inline-flex;gap:14px;align-items:center}.c .rule{width:3px;align-self:stretch;min-height:34px;background:var(--gold-500)}</style></head><body>
<div class="g">
<div><div class="cell chosen"><span class="c"><span class="rule"></span><span style="display:inline-flex;flex-direction:column;gap:6px"><span class="word" style="color:var(--navy-900)">LUX</span><span class="sub" style="color:var(--text-muted)">WELLNESS</span></span></span></div><div class="k"><b>C · Bracket — chosen</b>primary lockup</div></div>
<div><div class="cell dim"><span class="a"><span class="box"><span class="word" style="color:var(--gold-500)">LUX</span></span><span class="sub" style="color:var(--text-muted)">WELLNESS</span></span></div><div class="k"><b>A · Boxed</b>secondary — avatar crops</div></div>
<div><div class="cell dim"><span class="b"><span class="word" style="color:var(--navy-900)">LUX</span><span class="sub" style="color:var(--gold-700)">WELLNESS</span></span></div><div class="k"><b>B · Outline</b>secondary — print only</div></div>
</div></body></html>
