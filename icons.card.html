<!-- @dsCard group="Brand" viewport="700x180" name="Iconography" subtitle="Lucide, 1.75px stroke, 20/24px box — loaded from CDN" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-page)}.g{display:grid;grid-template-columns:repeat(10,1fr);gap:14px 10px}.c{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--blue-900)}.n{font-family:var(--font-mono);font-size:8px;letter-spacing:.04em;color:var(--text-subtle);text-align:center}svg{width:24px;height:24px;stroke-width:1.75}</style><script src="https://unpkg.com/lucide@0.427.0/dist/umd/lucide.js"></script></head><body>
<div class="g" id="g"></div>
<script>
const names=['heart-pulse','activity','flask-conical','microscope','stethoscope','apple','moon','dumbbell','calendar-check','message-circle','file-text','trending-up','shield-check','leaf','sun','droplet','clipboard-list','user-round','pill','brain'];
document.getElementById('g').innerHTML=names.map(n=>`<div class="c"><i data-lucide="${n}"></i><span class="n">${n}</span></div>`).join('');
lucide.createIcons();
</script></body></html>
