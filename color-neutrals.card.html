<!-- @dsCard group="Colors" viewport="700x150" name="Cream & neutrals" subtitle="Page #FAF7F2, white cards, cool-warm text greys" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-page)}.ramp{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}.sw{height:64px;display:flex;align-items:flex-end;padding:6px;border:1px solid rgba(13,31,60,.07)}.n{font-family:var(--font-display);font-size:10px;font-weight:700;letter-spacing:.08em}.hex{font-family:var(--font-sans);font-size:9px;color:var(--text-subtle);margin-top:6px}.tag{font-family:var(--font-sans);font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-subtle);display:block}</style></head><body>
<div class="ramp">
<div><div class="sw" style="background:var(--sand-900)"><span class="n" style="color:rgba(255,255,255,.85)">900</span></div><div class="hex">#22262E</div></div>
<div><div class="sw" style="background:var(--sand-800)"><span class="n" style="color:rgba(255,255,255,.85)">800</span></div><div class="hex">#3A4A62<span class="tag">body text</span></div></div>
<div><div class="sw" style="background:var(--sand-700)"><span class="n" style="color:rgba(255,255,255,.85)">700</span></div><div class="hex">#5A6880</div></div>
<div><div class="sw" style="background:var(--sand-600)"><span class="n" style="color:rgba(255,255,255,.85)">600</span></div><div class="hex">#8492A8</div></div>
<div><div class="sw" style="background:var(--sand-300)"><span class="n" style="color:rgba(13,31,60,.6)">300</span></div><div class="hex">#DDD8CE</div></div>
<div><div class="sw" style="background:var(--sand-100)"><span class="n" style="color:rgba(13,31,60,.6)">100</span></div><div class="hex">#F5F2EB</div></div>
<div><div class="sw" style="background:var(--cream)"><span class="n" style="color:rgba(13,31,60,.6)">50</span></div><div class="hex">#FAF7F2<span class="tag">page</span></div></div>
<div><div class="sw" style="background:var(--white)"><span class="n" style="color:rgba(13,31,60,.6)">W</span></div><div class="hex">#FFFFFF<span class="tag">cards</span></div></div>
</div></body></html>
