<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-page)}.card{background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:var(--radius-3);box-shadow:var(--shadow-1);padding:var(--space-6);display:flex;flex-direction:column;gap:var(--space-3);max-width:420px;position:relative}.eb{font-family:var(--font-mono);font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--text-accent)}.h{font-family:var(--font-sans);font-weight:600;font-size:21px;color:var(--text-strong)}.p{font-family:var(--font-sans);font-size:15px;line-height:1.6;color:var(--text-muted)}.note{font-family:var(--font-mono);font-size:9px;color:var(--text-subtle);letter-spacing:.06em;display:flex;gap:18px;margin-top:14px}.foot{border-top:1px solid var(--border-hairline);padding-top:var(--space-4);margin-top:var(--space-2);font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-subtle)}</style></head><body>
