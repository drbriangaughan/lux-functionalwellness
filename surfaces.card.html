<!-- @dsCard group="Surfaces" viewport="700x180" name="Surfaces" subtitle="Cream page, white card, sunken, gold wash, navy band" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-page)}.g{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.s{height:106px;padding:12px;display:flex;flex-direction:column;justify-content:space-between}.t{font-family:var(--font-sans);font-size:9px;letter-spacing:.1em;text-transform:uppercase}.h{font-family:var(--font-display);font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase}</style></head><body>
<div class="g">
<div class="s" style="background:var(--cream);border:1px solid var(--border-hairline)"><span class="h" style="color:var(--text-strong)">Page</span><span class="t" style="color:var(--text-subtle)">cream #FAF7F2</span></div>
<div class="s" style="background:var(--white);box-shadow:var(--shadow-1);border-top:4px solid var(--gold-500)"><span class="h" style="color:var(--text-strong)">Card</span><span class="t" style="color:var(--text-subtle)">white + gold rule</span></div>
<div class="s" style="background:var(--surface-sunken)"><span class="h" style="color:var(--text-strong)">Sunken</span><span class="t" style="color:var(--text-subtle)">sand 100</span></div>
<div class="s" style="background:var(--gold-100)"><span class="h" style="color:var(--text-strong)">Accent</span><span class="t" style="color:var(--gold-800)">gold 100</span></div>
<div class="s" style="background:var(--navy-900)"><span class="h" style="color:var(--white)">Band</span><span class="t" style="color:var(--gold-500)">navy 900</span></div>
</div></body></html>
