<!-- @dsCard group="Colors" viewport="700x200" name="Semantic roles" subtitle="Which token to reach for" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-page)}.rows{display:grid;grid-template-columns:1fr 1fr;gap:8px 24px}.r{display:flex;align-items:center;gap:10px;font-family:var(--font-sans);font-size:11px;letter-spacing:.04em;color:var(--text-muted)}.d{width:22px;height:22px;border:1px solid rgba(13,31,60,.12);flex:0 0 22px}</style></head><body>
<div class="rows">
<div class="r"><span class="d" style="background:var(--surface-page)"></span>--surface-page</div>
<div class="r"><span class="d" style="background:var(--action-accent)"></span>--action-accent</div>
<div class="r"><span class="d" style="background:var(--surface-card)"></span>--surface-card</div>
<div class="r"><span class="d" style="background:var(--action-primary)"></span>--action-primary</div>
<div class="r"><span class="d" style="background:var(--surface-sunken)"></span>--surface-sunken</div>
<div class="r"><span class="d" style="background:var(--border-accent)"></span>--border-accent</div>
<div class="r"><span class="d" style="background:var(--surface-inverse)"></span>--surface-inverse</div>
<div class="r"><span class="d" style="background:var(--border-hairline)"></span>--border-hairline</div>
<div class="r"><span class="d" style="background:var(--surface-accent-soft)"></span>--surface-accent-soft</div>
<div class="r"><span class="d" style="background:var(--text-strong)"></span>--text-strong</div>
<div class="r"><span class="d" style="background:var(--surface-brand-soft)"></span>--surface-brand-soft</div>
<div class="r"><span class="d" style="background:var(--text-body)"></span>--text-body</div>
<div class="r"><span class="d" style="background:var(--focus-ring)"></span>--focus-ring</div>
<div class="r"><span class="d" style="background:var(--text-accent)"></span>--text-accent</div>
</div></body></html>
