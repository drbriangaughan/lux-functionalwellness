<!-- @dsCard group="Surfaces" viewport="700x180" name="Protection gradient & blur" subtitle="Text over imagery, and the frosted sticky header" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-page)}.g{display:grid;grid-template-columns:1fr 1fr;gap:14px}.media{position:relative;height:132px;border-radius:var(--radius-4);overflow:hidden;background:var(--blue-700);display:flex;align-items:flex-end}.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.35)}.scrim{position:absolute;inset:0;background:var(--gradient-protect)}.cap{position:relative;padding:14px;font-family:var(--font-display);font-stretch:112%;font-weight:700;font-size:20px;color:var(--sand-50)}.panel{position:relative;height:132px;border-radius:var(--radius-4);overflow:hidden;background:var(--blue-700)}.bar{position:absolute;left:0;right:0;top:0;padding:12px 14px;background:rgba(251,249,244,.72);backdrop-filter:var(--blur-panel);display:flex;justify-content:space-between;align-items:center;font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue-900)}</style></head><body>
<div class="g">
<div class="media"><div class="ph">image placeholder</div><div class="scrim"></div><div class="cap">Care that reads the whole picture</div></div>
<div class="panel"><div class="ph">image placeholder</div><div class="bar"><span>LUX</span><span>Sticky header · blur 14px</span></div></div>
</div></body></html>
